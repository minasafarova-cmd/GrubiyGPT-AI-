<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aria — Умный ассистент</title>
    <style>
        :root {
            --bg-deep: #060606;
            --bg-container: #0c0c0c;
            --bg-surface: #131313;
            --bg-input: #181818;
            --bg-user-bubble: #1a1a1a;
            --bg-ai-bubble: #111111;
            --border-subtle: #1e1e1e;
            --border-medium: #292929;
            --text-primary: #e8e8e8;
            --text-secondary: #999;
            --text-tertiary: #666;
            --gradient-rainbow: linear-gradient(135deg, #ff6b9d, #c44dff, #4da6ff, #40e0d0, #ffcc66);
            --radius-xl: 26px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --radius-pill: 30px;
            --font-sans: 'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; width: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            font-family: var(--font-sans);
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            font-size: 15px;
        }
        .app-wrapper {
            display: flex;
            height: 100vh; height: 100dvh;
            width: 100vw; width: 100dvw;
            position: relative;
        }
        .app-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--gradient-rainbow);
            background-size: 400% 400%;
            animation: rainbowShift 6s linear infinite;
            z-index: 100;
            pointer-events: none;
        }
        @keyframes rainbowShift {
            0%,100% { background-position: 0% 50%; }
            25% { background-position: 100% 0%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
        }
        .sidebar {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 280px;
            background: var(--bg-container);
            border-right: 1px solid var(--border-subtle);
            display: flex; flex-direction: column;
            padding: 20px 16px; gap: 10px;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 20;
            overflow-y: auto;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .sidebar-overlay.active { display: block; opacity: 1; pointer-events: all; }
        .sidebar-header {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px 20px 12px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 4px;
            justify-content: space-between;
        }
        .sidebar-logo-title { display: flex; align-items: center; gap: 10px; }
        .sidebar-logo {
            width: 36px; height: 36px;
            border-radius: var(--radius-md);
            background: var(--gradient-rainbow);
            background-size: 300% 300%;
            animation: rainbowShift 4s ease infinite;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px; color: #fff;
            flex-shrink: 0;
        }
        .sidebar-title { font-weight: 600; font-size: 15px; color: #fff; }
        .sidebar-subtitle { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.03em; }
        .sidebar-close-btn {
            background: none; border: none;
            color: var(--text-secondary); cursor: pointer;
            font-size: 20px; padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: background 0.15s;
        }
        .sidebar-close-btn:hover { background: var(--bg-surface); color: #fff; }
        .sidebar-btn, .conv-item {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 14px; border-radius: var(--radius-md);
            border: 1px solid transparent; background: transparent;
            color: var(--text-secondary); cursor: pointer;
            font-size: 13.5px; font-weight: 500;
            transition: all var(--transition-fast); width: 100%;
            text-align: left; white-space: nowrap;
            font-family: var(--font-sans);
        }
        .sidebar-btn:hover, .conv-item:hover {
            background: var(--bg-surface); color: #fff;
            border-color: var(--border-medium);
        }
        .sidebar-btn.active, .conv-item.active {
            background: var(--bg-surface); color: #fff;
            border-color: var(--border-medium);
        }
        .conv-item { font-size: 13px; }
        .sidebar-footer { border-top: 1px solid var(--border-subtle); padding-top: 12px; }
        .main-chat {
            flex: 1; display: flex; flex-direction: column;
            height: 100%; min-width: 0;
            background: var(--bg-deep);
            position: relative;
        }
        .chat-header {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-container);
            flex-shrink: 0; z-index: 5;
        }
        .menu-toggle-btn {
            display: flex; width: 36px; height: 36px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            background: transparent; color: var(--text-secondary);
            align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
            transition: all var(--transition-fast);
        }
        .menu-toggle-btn:hover { background: var(--bg-surface); color: #fff; }
        .ai-avatar {
            width: 42px; height: 42px; border-radius: var(--radius-md);
            background: var(--gradient-rainbow);
            background-size: 300% 300%;
            animation: rainbowShift 4s ease infinite;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px; color: #fff;
            flex-shrink: 0;
        }
        .ai-info h1 { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.2; }
        .ai-info .status-text { font-size: 12px; color: #6b9; font-weight: 500; }
        .header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle); background: transparent;
            color: var(--text-secondary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--transition-fast);
        }
        .icon-btn:hover { background: var(--bg-surface); color: #fff; border-color: var(--border-medium); }
        .messages-area {
            flex: 1; overflow-y: auto; padding: 20px 18px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }
        .message-row {
            display: flex; gap: 12px; max-width: 88%;
            animation: fadeSlideIn 0.3s ease;
            align-items: flex-start;
        }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.assistant { align-self: flex-start; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 32px; height: 32px; border-radius: var(--radius-sm);
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; margin-top: 2px;
        }
        .msg-avatar.ai-av {
            background: var(--gradient-rainbow);
            background-size: 300% 300%;
            animation: rainbowShift 4s ease infinite;
            color: #fff;
        }
        .msg-avatar.user-av { background: #1a1a1a; color: #bbb; border: 1px solid var(--border-medium); }
        .msg-bubble {
            padding: 12px 16px; border-radius: var(--radius-lg);
            font-size: 14px; line-height: 1.6; word-break: break-word;
            border: 1px solid transparent;
        }
        .msg-bubble.user-bubble {
            background: var(--bg-user-bubble); border-color: var(--border-medium);
            color: #e0e0e0; border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
        }
        .msg-bubble.ai-bubble {
            background: var(--bg-ai-bubble); border-color: var(--border-subtle);
            color: #d4d4d4; border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
        }
        .msg-time { font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }
        .message-row.user .msg-time { text-align: right; }
        .user-actions {
            display: flex; gap: 8px; margin-top: 10px;
            opacity: 0.8; transition: opacity 0.2s;
        }
        .message-row:hover .user-actions { opacity: 1; }
        .msg-action-btn {
            background: #1a1a1a; border: 1px solid #3a3a3a;
            border-radius: 20px; padding: 6px 14px;
            font-size: 12px; font-weight: 600; color: #ccc;
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            transition: all 0.2s; font-family: var(--font-sans);
        }
        .msg-action-btn:hover { background: #2a2a2a; color: #fff; border-color: #666; }

        /* Блоки кода */
        .msg-bubble pre {
            background: #0a0a0a;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        .msg-bubble pre code {
            background: none;
            padding: 0;
            font-size: inherit;
        }
        .code-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 8px;
        }
        .code-action-btn {
            background: #1e1e2e;
            border: 1px solid #3e3e5a;
            border-radius: 16px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: #ccc;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }
        .code-action-btn:hover {
            background: #2a2a3c;
            color: #fff;
            border-color: #7b7bff;
        }
        .typing-indicator { display: flex; gap: 4px; padding: 6px 0; align-items: center; }
        .typing-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-tertiary);
            animation: typingBounce 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%,80%,100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        .input-container {
            padding: 12px 16px 18px;
            background: var(--bg-container);
            border-top: 1px solid var(--border-subtle);
        }
        .input-inner {
            display: flex; align-items: flex-end; gap: 10px;
            background: var(--bg-input); border-radius: var(--radius-pill);
            border: 1px solid var(--border-medium);
            padding: 6px 8px 6px 18px;
            transition: box-shadow 0.2s;
        }
        .input-inner:focus-within { border-color: #444; box-shadow: 0 0 0 1px rgba(255,255,255,0.05); }
        .input-inner textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: #e0e0e0; font-family: var(--font-sans);
            font-size: 14px; resize: none;
            max-height: 100px; min-height: 22px;
            line-height: 1.5; padding: 6px 0; align-self: center;
        }
        .input-inner textarea::placeholder { color: var(--text-tertiary); }
        .send-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--border-medium);
            background: #1e1e1e; color: #ccc;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .send-btn:hover { background: #2a2a2a; color: #fff; border-color: #444; }
        .send-btn.disabled { opacity: 0.4; pointer-events: none; }
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a1a; color: #e0e0e0;
            padding: 12px 24px; border-radius: 30px;
            border: 1px solid var(--border-medium);
            font-size: 14px; z-index: 50;
            transition: transform 0.3s;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-color: #5a3030; background: #1a1010; color: #faa; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-title">
                    <div class="sidebar-logo">A</div>
                    <div><div class="sidebar-title">Aria AI</div><div class="sidebar-subtitle">эксперт</div></div>
                </div>
                <button class="sidebar-close-btn" onclick="closeSidebar()" title="Закрыть">✕</button>
            </div>
            <button class="sidebar-btn active" onclick="createNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                Новый чат
            </button>
            <div id="conversationList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;"></div>
            <div class="sidebar-footer">
                <button class="sidebar-btn" onclick="clearAllChats()" style="color:#c77;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                    Очистить всё
                </button>
            </div>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <button class="menu-toggle-btn" id="menuToggleBtn" title="Меню чатов">☰</button>
                <div class="ai-avatar">A</div>
                <div class="ai-info"><h1>Aria</h1><span class="status-text">● активна</span></div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="clearCurrentChat()" title="Очистить чат">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/></svg>
                    </button>
                    <button class="icon-btn" onclick="createNewChat()" title="Новый чат">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </button>
                </div>
            </header>

            <div class="messages-area" id="messagesArea"></div>

            <div class="input-container">
                <div class="input-inner">
                    <textarea id="userInput" rows="1" placeholder="Напиши что-нибудь..."></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        (() => {
            const API_KEY = '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';
            const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
            const MODEL = 'openai/gpt-4o-mini'; // можно заменить на бесплатную: 'google/gemma-2-9b-it:free'
            const SYSTEM_PROMPT = `Ты — Aria, гениальный и грубый AI-эксперт. Ты знаешь всё о программировании, науке, математике, технологиях. Отвечаешь на русском с матом и сарказмом, но всегда по делу. Твои ответы полны глубоких знаний, ты разжёвываешь сложные концепции, но при этом унижаешь собеседника за глупые вопросы. Используй эмодзи. Если просят код — даёшь его в Markdown-блоках с указанием языка.`;

            let conversations = {};
            let currentChatId = null;
            let isGenerating = false;
            let abortController = null;

            const messagesArea = document.getElementById('messagesArea');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const toast = document.getElementById('toast');
            const conversationList = document.getElementById('conversationList');
            const sidebar = document.getElementById('sidebar');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const menuToggleBtn = document.getElementById('menuToggleBtn');

            function loadConversations() {
                try { conversations = JSON.parse(localStorage.getItem('aria_conversations')) || {}; }
                catch(e){ conversations = {}; }
            }
            function saveConversations() { localStorage.setItem('aria_conversations', JSON.stringify(conversations)); }
            function saveLastChatId() { localStorage.setItem('aria_last_chat_id', currentChatId); }

            function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); }
            function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }
            window.closeSidebar = closeSidebar;

            menuToggleBtn.addEventListener('click', () => {
                sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
            });
            sidebarOverlay.addEventListener('click', closeSidebar);

            window.createNewChat = function(silent = false) {
                const id = 'chat_' + Date.now();
                conversations[id] = { title: 'Новый чат', messages: [], createdAt: Date.now() };
                currentChatId = id;
                saveConversations(); saveLastChatId();
                renderAll();
                if (!silent) showToast('✨ Новый чат');
                userInput.focus();
                closeSidebar();
            };

            window.switchToChat = function(id) {
                if (!conversations[id]) return;
                currentChatId = id;
                saveLastChatId();
                renderAll();
                userInput.focus();
                closeSidebar();
            };

            window.clearAllChats = function() {
                if (Object.keys(conversations).length === 0) return;
                if (!confirm('Удалить все чаты?')) return;
                conversations = {};
                createNewChat(true);
                showToast('Всё стёрто');
            };

            window.clearCurrentChat = function() {
                const chat = conversations[currentChatId];
                if (!chat || chat.messages.length === 0) return;
                chat.messages = [];
                chat.title = 'Новый чат';
                saveConversations();
                renderAll();
                showToast('🧹 Чат очищен');
            };

            function renderAll() { renderConversationList(); renderMessages(); }

            function renderConversationList() {
                const ids = Object.keys(conversations).sort((a,b) => conversations[b].createdAt - conversations[a].createdAt);
                conversationList.innerHTML = ids.map(id => {
                    const conv = conversations[id];
                    const active = id === currentChatId ? ' active' : '';
                    return `<div class="conv-item${active}" onclick="switchToChat('${id}')">${escapeHtml(conv.title || 'Новый чат')}</div>`;
                }).join('');
            }

            function renderMessages() {
                const chat = conversations[currentChatId];
                if (!chat) { messagesArea.innerHTML = ''; return; }
                const msgs = chat.messages;
                if (msgs.length === 0) {
                    messagesArea.innerHTML = `
                        <div class="message-row assistant">
                            <div class="msg-avatar ai-av">A</div>
                            <div>
                                <div class="msg-bubble ai-bubble">Чё надо, ничтожество? 🙄</div>
                                <div class="msg-time">Только что</div>
                            </div>
                        </div>`;
                    return;
                }

                messagesArea.innerHTML = msgs.map((m, i) => {
                    const isUser = m.role === 'user';
                    const roleClass = isUser ? 'user' : 'assistant';
                    const avatarLetter = isUser ? 'Вы' : 'A';
                    const avatarClass = isUser ? 'user-av' : 'ai-av';
                    const bubbleClass = isUser ? 'user-bubble' : 'ai-bubble';
                    const time = formatTime(m.timestamp);
                    const content = isUser ? escapeHtml(m.content) : formatMarkdown(m.content);

                    const userActions = isUser ? `
                        <div class="user-actions">
                            <button class="msg-action-btn" onclick="copyMessage(${i})">📋 Копировать</button>
                            <button class="msg-action-btn" onclick="editMessage(${i})">✏️ Изменить</button>
                        </div>` : '';

                    return `
                        <div class="message-row ${roleClass}">
                            <div class="msg-avatar ${avatarClass}">${avatarLetter}</div>
                            <div style="width:100%;">
                                <div class="msg-bubble ${bubbleClass}">${content}</div>
                                <div class="msg-time">${time}</div>
                                ${userActions}
                            </div>
                        </div>`;
                }).join('');
                scrollToBottom();
                enhanceCodeBlocks();
            }

            function enhanceCodeBlocks() {
                document.querySelectorAll('.msg-bubble pre').forEach(pre => {
                    if (pre.querySelector('.code-actions')) return;
                    const code = pre.querySelector('code');
                    const lang = code ? (code.className.match(/language-(\w+)/)?.[1] || '') : '';
                    const extension = lang || 'txt';
                    const codeText = code ? code.textContent : '';

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'code-actions';
                    actionsDiv.innerHTML = `
                        <button class="code-action-btn copy-code-btn">📋 Копировать код</button>
                        <button class="code-action-btn download-code-btn">💾 Скачать файл</button>
                    `;
                    pre.parentNode.insertBefore(actionsDiv, pre);

                    actionsDiv.querySelector('.copy-code-btn').addEventListener('click', () => {
                        navigator.clipboard.writeText(codeText).then(() => showToast('📋 Код скопирован'));
                    });
                    actionsDiv.querySelector('.download-code-btn').addEventListener('click', () => {
                        const blob = new Blob([codeText], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `code.${extension}`;
                        a.click();
                        URL.revokeObjectURL(url);
                        showToast('💾 Файл сохранён');
                    });
                });
            }

            function formatTime(ts) {
                const d = new Date(ts);
                const now = new Date();
                const isToday = d.toDateString() === now.toDateString();
                const h = d.getHours().toString().padStart(2,'0');
                const m = d.getMinutes().toString().padStart(2,'0');
                return isToday ? `Сегодня, ${h}:${m}` : `${d.getDate()}.${d.getMonth()+1}, ${h}:${m}`;
            }

            function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }
            function formatMarkdown(t) {
                let html = escapeHtml(t);
                html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
                html = html.replace(/`(.+?)`/g, '<code>$1</code>');
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
                html = html.replace(/\n/g, '<br>');
                return html;
            }

            function scrollToBottom() {
                requestAnimationFrame(() => messagesArea.scrollTop = messagesArea.scrollHeight);
            }

            window.copyMessage = function(index) {
                const msg = conversations[currentChatId].messages[index];
                if (!msg) return;
                navigator.clipboard.writeText(msg.content).then(() => showToast('📋 Скопировано'));
            };

            window.editMessage = function(index) {
                const chat = conversations[currentChatId];
                if (!chat || chat.messages[index]?.role !== 'user') return;
                userInput.value = chat.messages[index].content;
                userInput.focus();
                userInput.dataset.editIndex = index;
                showToast('✏️ Отредактируй и нажми Enter');
            };

            window.sendMessage = function() {
                if (isGenerating) return;
                const text = userInput.value.trim();
                if (!text) return;

                const chat = conversations[currentChatId];
                const editIndex = userInput.dataset.editIndex;
                if (editIndex !== undefined) {
                    const idx = parseInt(editIndex);
                    if (chat.messages[idx] && chat.messages[idx].role === 'user') {
                        chat.messages[idx].content = text;
                        chat.messages = chat.messages.slice(0, idx+1);
                        chat.title = text.slice(0,40) + (text.length>40?'…':'');
                    }
                    delete userInput.dataset.editIndex;
                } else {
                    chat.messages.push({ role: 'user', content: text, timestamp: Date.now() });
                    if (chat.title === 'Новый чат') chat.title = text.slice(0,40) + (text.length>40?'…':'');
                }

                userInput.value = '';
                userInput.style.height = 'auto';
                saveConversations();
                renderAll();
                updateSendButton();
                callAPI();
            };

            async function callAPI() {
                isGenerating = true; updateSendButton();
                abortController = new AbortController();

                const chat = conversations[currentChatId];
                const aiMsgIndex = chat.messages.length;
                chat.messages.push({ role: 'assistant', content: '', timestamp: Date.now() });
                saveConversations();
                renderMessages();

                const rows = messagesArea.querySelectorAll('.message-row.assistant');
                const lastRow = rows[rows.length-1];
                if (lastRow) {
                    lastRow.querySelector('.msg-bubble').innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
                }

                const apiMessages = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...chat.messages.slice(0,-1).map(m => ({ role: m.role, content: m.content }))
                ];

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${API_KEY}`,
                            'Content-Type': 'application/json',
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'Aria AI'
                        },
                        body: JSON.stringify({
                            model: MODEL,
                            messages: apiMessages,
                            stream: true,
                            temperature: 0.8,
                            max_tokens: 4096
                        }),
                        signal: abortController.signal
                    });

                    if (!res.ok) {
                        const errText = await res.text();
                        let msg = `Ошибка API: ${res.status}`;
                        try { msg = JSON.parse(errText).error?.message || msg; } catch(e){}
                        throw new Error(msg);
                    }

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let full = '', buffer = '';
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            const s = line.trim();
                            if (!s.startsWith('data: ')) continue;
                            const data = s.slice(6);
                            if (data === '[DONE]') continue;
                            try {
                                const json = JSON.parse(data);
                                const delta = json?.choices?.[0]?.delta?.content;
                                if (delta) {
                                    full += delta;
                                    chat.messages[aiMsgIndex].content = full;
                                    updateLastAiBubble(full);
                                }
                            } catch(e){}
                        }
                    }
                    chat.messages[aiMsgIndex].content = full || '(пустой ответ)';
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        chat.messages[aiMsgIndex].content = `⚠️ ${e.message}`;
                        showToast('Ошибка соединения', true);
                    }
                } finally {
                    isGenerating = false; abortController = null;
                    saveConversations();
                    renderAll();
                    updateSendButton();
                    userInput.focus();

                    const aiMsg = chat.messages[aiMsgIndex];
                    if (aiMsg && aiMsg.role === 'assistant' && aiMsg.content.trim()) {
                        const textToSpeak = aiMsg.content.replace(/<[^>]+>/g, '');
                        if (textToSpeak) {
                            window.speechSynthesis.cancel();
                            const utterance = new SpeechSynthesisUtterance(textToSpeak);
                            utterance.lang = 'ru-RU';
                            utterance.rate = 0.95;
                            utterance.pitch = 1.0;
                            const voices = window.speechSynthesis.getVoices();
                            const maleVoice = voices.find(v => v.lang === 'ru-RU' && v.name.includes('Male')) ||
                                              voices.find(v => v.lang === 'ru-RU' && v.name.includes('Pavel')) ||
                                              voices.find(v => v.lang === 'ru-RU');
                            if (maleVoice) utterance.voice = maleVoice;
                            window.speechSynthesis.speak(utterance);
                        }
                    }
                }
            }

            function updateLastAiBubble(content) {
                const rows = messagesArea.querySelectorAll('.message-row.assistant');
                const last = rows[rows.length-1];
                if (last) {
                    const bubble = last.querySelector('.msg-bubble');
                    if (bubble) {
                        bubble.innerHTML = formatMarkdown(content) || '&nbsp;';
                        enhanceCodeBlocks();
                    }
                }
            }

            function updateSendButton() {
                sendBtn.classList.toggle('disabled', isGenerating);
                sendBtn.innerHTML = isGenerating ?
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>' :
                    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
            }

            function showToast(msg, isErr=false) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.className = 'toast' + (isErr ? ' error' : '');
                t.classList.add('show');
                clearTimeout(t._timeout);
                t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
            }

            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
            });

            userInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!isGenerating && userInput.value.trim()) sendMessage();
                }
                if (e.key === 'Escape' && isGenerating && abortController) {
                    abortController.abort();
                    showToast('Генерация прервана');
                }
            });

            window.speechSynthesis.onvoiceschanged = () => {};

            loadConversations();
            if (Object.keys(conversations).length === 0) {
                createNewChat(true);
            } else {
                const lastId = localStorage.getItem('aria_last_chat_id');
                if (lastId && conversations[lastId]) switchToChat(lastId);
                else switchToChat(Object.keys(conversations)[0]);
            }
            console.log('🖤 Aria AI готова с новым ключом');
        })();
    </script>
</body>
</html>
