<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ГрубыйGPT Recode Alpha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #f5f5f7; --surface: rgba(255,255,255,0.7);
            --text: #1a1a2e; --text-secondary: #555; --border: rgba(0,0,0,0.06);
            --accent: #7c3aed; --accent-light: #ede9fe; --bubble-bg: #ffffff; --input-bg: #ffffff;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body.dark {
            --bg: #0f0f1a; --surface: rgba(25,25,35,0.8);
            --text: #e2e8f0; --text-secondary: #94a3b8; --border: rgba(255,255,255,0.08);
            --accent: #a78bfa; --accent-light: #312e81; --bubble-bg: rgba(255,255,255,0.06); --input-bg: rgba(255,255,255,0.05);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; width: 100vw; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .app { display: flex; width: 100%; height: 100%; max-width: 100%; margin: 0 auto; position: relative; flex-direction: column; }
        .chat-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 50; }
        .chat-modal.open { display: flex; }
        .chat-modal-content { background: var(--surface); backdrop-filter: blur(40px); border:1px solid var(--border); border-radius:28px; padding:24px; width:90%; max-width:360px; max-height:70vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.15); animation: fadeSlide 0.3s ease; }
        @keyframes fadeSlide { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        .chat-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom:16px; }
        .chat-modal-header h3 { color: var(--accent); font-size: 1.2rem; }
        .chat-modal-close { background: transparent; border:none; color: var(--text-secondary); font-size:24px; cursor:pointer; transition: transform 0.2s; }
        .chat-modal-close:hover { transform: rotate(90deg); }
        .chat-list { flex:1; overflow-y:auto; margin:12px 0; display:flex; flex-direction:column; gap:4px; }
        .chat-item { padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--text-secondary); font-size:0.85rem; display:flex; justify-content:space-between; transition: background 0.15s, color 0.15s; }
        .chat-item:hover { background: var(--accent-light); color: var(--accent); }
        .chat-item.active { background: var(--accent); color:white; font-weight:600; }
        .new-chat-btn { background:transparent; border:1px dashed var(--border); color:var(--text-secondary); padding:12px; border-radius:10px; font-size:0.9rem; cursor:pointer; transition: background 0.15s; text-align:center; }
        .new-chat-btn:hover { background:var(--accent-light); border-color:var(--accent); color:var(--accent); }
        .main { flex:1; display:flex; flex-direction:column; background:var(--surface); backdrop-filter:blur(20px); overflow:hidden; }
        .top-bar { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); min-height: 56px; position: relative; }
        .hamburger-btn { background: transparent; border:none; color: var(--text); font-size: 26px; cursor:pointer; padding:4px; border-radius:8px; transition: color 0.2s; }
        .hamburger-btn:hover { color: var(--accent); }
        .user-info-top { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; cursor:pointer; }
        .avatar-small { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; box-shadow: 0 4px 10px rgba(124,58,237,0.3); }
        .three-dots { font-size: 24px; cursor:pointer; padding:8px; color: var(--text-secondary); border-radius:8px; transition: background 0.15s; }
        .three-dots:hover { background: var(--accent-light); }
        .dropdown-menu { position: absolute; top: 56px; right: 16px; background: var(--surface); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 30; min-width: 180px; transform-origin: top right; animation: dropdownPop 0.2s ease; }
        .dropdown-menu.open { display: flex; }
        @keyframes dropdownPop { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
        .dropdown-btn { background: transparent; border:none; color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; text-align: left; cursor:pointer; transition: background 0.15s; }
        .dropdown-btn:hover { background: var(--accent-light); color: var(--accent); }
        .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
        .msg { display:flex; gap:8px; animation: msgSlide 0.3s ease; }
        .msg.user { flex-direction:row-reverse; }
        @keyframes msgSlide { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
        .bubble { max-width:80%; padding:12px 16px; border-radius:18px; font-size:0.95rem; line-height:1.45; word-break:break-word; background:var(--bubble-bg); color:var(--text); border:1px solid var(--border); box-shadow:0 4px 10px rgba(0,0,0,0.03); transition: transform 0.15s; }
        .bubble:hover { transform: scale(1.01); }
        .user .bubble { background:var(--accent); color:white; border:none; }
        .typing { display:flex; gap:4px; padding:6px 0; }
        .typing span { width:6px; height:6px; background:var(--accent); border-radius:50%; animation:bounce 1.2s infinite; }
        .typing span:nth-child(2){ animation-delay:0.2s; } .typing span:nth-child(3){ animation-delay:0.4s; }
        @keyframes bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.3;} 40%{transform:scale(1.4);opacity:1;} }
        .bottom-area { padding: 8px 16px calc(8px + var(--safe-bottom)); border-top:1px solid var(--border); background: transparent; display:flex; flex-direction: column; gap: 10px; }
        .input-row { display:flex; align-items:center; gap:8px; background:var(--input-bg); backdrop-filter:blur(10px); border-radius: 28px; padding: 6px 8px 6px 20px; border:1px solid var(--border); transition: border-color 0.2s; }
        .input-row:focus-within { border-color:var(--accent); }
        .input-row input { flex:1; background:transparent; border:none; outline:none; font-size: 1.05rem; padding: 16px 0; color:var(--text); }
        .send-btn { background:var(--accent); border:none; width: 52px; height: 52px; border-radius: 16px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:white; font-size:26px; box-shadow:0 4px 12px rgba(124,58,237,0.4); transition: transform 0.15s, box-shadow 0.15s; }
        .send-btn:active { transform:scale(0.94); }
        .action-buttons { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
        .action-btn { flex: 1; background: var(--accent); color: white; border: none; padding: 14px 8px; border-radius: 16px; font-weight: 700; font-size: 1rem; cursor:pointer; transition: background 0.15s; text-align: center; }
        .action-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .model-btn { background:var(--input-bg); border:1px solid var(--border); border-radius:12px; padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:0.9rem; color:var(--text-secondary); transition: background 0.15s; }
        .model-btn:hover { background: var(--accent-light); }
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); backdrop-filter:blur(8px); z-index:100; display:none; align-items:center; justify-content:center; }
        .modal.active { display:flex; }
        .modal-card { background:var(--surface); backdrop-filter:blur(40px); border:1px solid var(--border); border-radius:28px; padding:28px; max-width:380px; width:90%; text-align:center; color:var(--text); box-shadow:0 20px 40px rgba(0,0,0,0.15); animation: fadeSlide 0.3s ease; }
        .modal-card h3 { margin-bottom: 16px; font-size: 1.3rem; color: var(--accent); }
        .modal-card input { width:100%; padding:14px; margin:8px 0; background: var(--bg); border:1px solid var(--border); border-radius: 14px; color: var(--text); outline: none; font-size: 1rem; }
        .modal-card button { background: var(--accent); border: none; padding: 14px 24px; border-radius: 14px; font-weight: 700; color: white; cursor:pointer; margin: 8px 4px; font-size: 1rem; transition: filter 0.15s; }
        .modal-card button:hover { filter: brightness(1.1); }
        .modal-card button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e1e2e; color:white; padding:12px 24px; border-radius:16px; border:1px solid var(--accent); font-size:0.9rem; font-weight:500; opacity:0; pointer-events:none; transition:opacity 0.3s, transform 0.3s; z-index:200; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(-10px); }
        .admin-user-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
        .admin-user-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); }
        .admin-user-item button { background: var(--accent); border: none; color: white; padding: 6px 14px; border-radius: 8px; font-weight: 600; cursor:pointer; }
        @media (min-width: 768px) { .app { max-width: 600px; } }
    </style>
</head>
<body>
<div class="app">
    <div class="chat-modal" id="chatModal">
        <div class="chat-modal-content">
            <div class="chat-modal-header"><h3>Чаты</h3><button class="chat-modal-close" onclick="closeChatModal()">✕</button></div>
            <div class="chat-list" id="chatList"></div>
            <button class="new-chat-btn" id="newChatBtn">+ Новый чат</button>
        </div>
    </div>

    <div class="main">
        <div class="top-bar">
            <button class="hamburger-btn" onclick="openChatModal()">☰</button>
            <div style="flex:1;"></div>
            <div class="user-info-top" onclick="openProfile()">
                <div class="avatar-small" id="topAvatar">?</div>
                <span id="topName">Гость</span>
            </div>
            <div class="three-dots" id="threeDots" onclick="toggleDropdown()">⋮</div>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-btn" id="themeDropdownBtn" onclick="toggleTheme()">🌙 Тёмная тема</button>
                <button class="dropdown-btn" id="adminDropdownBtn" onclick="handleAdminClick()">👑 Админ‑панель</button>
                <button class="dropdown-btn" id="logoutDropdownBtn" onclick="logoutUser()" style="display:none;">🚪 Выйти</button>
                <button class="dropdown-btn" id="loginDropdownBtn" onclick="openAuthModal('login')">🔑 Войти / Регистрация</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="msg ai"><div class="msg-avatar" style="width:32px;height:32px;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);">AI</div><div class="bubble">Для начала общения необходимо войти или зарегистрироваться.</div></div>
        </div>

        <div class="bottom-area">
            <div class="input-row"><input type="text" id="userInput" placeholder="Введите сообщение..." autofocus disabled><button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button></div>
            <div class="action-buttons" id="authButtons">
                <button class="action-btn secondary" onclick="openAuthModal('login')">Вход</button>
                <button class="action-btn" onclick="openAuthModal('register')">Регистрация</button>
            </div>
            <div id="modelSelector" style="display:none; justify-content:flex-start;"><div class="model-btn" onclick="openModelMenu()"><span id="currentModelLabel">Gemini Flash</span><span style="font-size:12px;">▼</span></div></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="authModal">
    <div class="modal-card"><h3 id="authTitle">Вход</h3><input type="text" id="authName" placeholder="Имя пользователя"><input type="password" id="authPassword" placeholder="Пароль"><button onclick="submitAuth()">Войти</button><button class="secondary" onclick="switchAuthMode()">Создать аккаунт</button><div id="authError" style="color:#ef4444;font-size:0.85rem;margin-top:8px;"></div></div>
</div>
<div class="modal" id="adminCodeModal">
    <div class="modal-card"><h3>🔐 Введите код администратора</h3><input type="text" id="adminCodeInput" placeholder="Введите секретный код"><button onclick="submitAdminCode()">Подтвердить</button><button class="secondary" onclick="closeAdminCodeModal()">Отмена</button><div id="adminCodeError" style="color:#ef4444;font-size:0.85rem;margin-top:8px;"></div></div>
</div>
<div class="modal" id="profileModal">
    <div class="modal-card"><h3>👤 Профиль</h3><div id="profileInfo" style="text-align:left; font-size:0.95rem;"></div><button class="secondary" onclick="closeProfileModal()" style="margin-top:12px;">Закрыть</button></div>
</div>
<div class="modal" id="adminModal">
    <div class="modal-card" style="max-width:400px;"><h3>👑 Админ‑панель</h3><div class="admin-user-list" id="userList"></div><button class="secondary" onclick="closeAdminModal()" style="margin-top:12px;">Закрыть</button></div>
</div>
<div class="modal" id="modelMenu" style="display:none; align-items:center; justify-content:center; position:fixed; top:0;left:0;width:100%;height:100%; background:rgba(0,0,0,0.3); backdrop-filter:blur(8px); z-index:101;">
    <div class="modal-card" style="max-width:320px; text-align:left;"><h3 style="margin-bottom:12px; color:var(--accent);">Выбор модели</h3><div style="display:flex;flex-direction:column;gap:8px;" id="modelOptions"></div><button class="secondary" onclick="closeModelMenu()" style="margin-top:12px;">Закрыть</button></div>
</div>
<div class="modal" id="keyModal">
    <div class="modal-card"><h3>🔑 API-ключ OpenRouter</h3><p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:12px;">Текущий ключ не работает. Вставьте новый ключ.</p><input type="text" id="apiKeyInput" placeholder="sk-or-v1-..."><button onclick="saveApiKey()">Сохранить</button><button class="secondary" onclick="closeKeyModal()">Отмена</button><div id="keyError" style="color:#ef4444;font-size:0.8rem;margin-top:8px;"></div></div>
</div>

<script>
    const ADMIN_CODE = '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';
    let API_KEY = localStorage.getItem('grubiy_api_key') || ADMIN_CODE;
    const NORMAL_MODEL = 'google/gemini-2.0-flash-001';
    const PREMIUM_MODEL = 'openai/gpt-4o-mini';

    let currentUser = null;
    let currentChatId = null;
    let chats = [];
    let currentModel = NORMAL_MODEL;
    let conversationHistory = [];
    let authMode = 'login';

    function getUsers() { return JSON.parse(localStorage.getItem('grubiy_users') || '[]'); }
    function saveUsers(u) { localStorage.setItem('grubiy_users', JSON.stringify(u)); }
    function getUserByName(n) { return getUsers().find(u => u.name === n); }
    function createUser(name, pass) { const users = getUsers(); if (users.find(u => u.name === name)) return false; users.push({ name, password: pass, premium: false, isAdmin: false }); saveUsers(users); return true; }
    function authenticate(name, pass) { const user = getUserByName(name); return (user && user.password === pass) ? user : null; }
    function updateUser(name, updates) { const users = getUsers(); const i = users.findIndex(u => u.name === name); if (i === -1) return false; users[i] = { ...users[i], ...updates }; saveUsers(users); if (currentUser && currentUser.name === name) { currentUser = { ...users[i] }; updateUIForAuth(); } return true; }
    function makeUserAdmin(name) { return updateUser(name, { isAdmin: true, premium: true }); }

    function loadChatsForUser(username) { return JSON.parse(localStorage.getItem(`chats_${username}`) || '[]'); }
    function saveChatsForUser(username) { localStorage.setItem(`chats_${username}`, JSON.stringify(chats)); }
    function createNewChat(title = 'Новый чат') { const id = Date.now().toString(); const chat = { id, title, messages: [] }; chats.push(chat); saveChatsForUser(currentUser.name); return chat; }
    function deleteChat(chatId) { chats = chats.filter(c => c.id !== chatId); if (currentChatId === chatId) { if (chats.length > 0) { switchToChat(chats[0].id); } else { const newChat = createNewChat(); switchToChat(newChat.id); } } saveChatsForUser(currentUser.name); renderChatList(); }
    function switchToChat(chatId) { if (currentChatId) { const active = chats.find(c => c.id === currentChatId); if (active) active.messages = conversationHistory.slice(); } currentChatId = chatId; const chat = chats.find(c => c.id === chatId); conversationHistory = chat ? [...chat.messages] : []; if (conversationHistory.length === 0) { conversationHistory.push({ role: "system", content: getSystemPrompt() }); conversationHistory.push({ role: "assistant", content: "Привет! Задавайте вопросы." }); } renderChat(); renderChatList(); }
    function renderChatList() { const container = document.getElementById('chatList'); if (!currentUser) { container.innerHTML = ''; return; } container.innerHTML = chats.map(c => `<div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="switchToChat('${c.id}')"><span style="flex:1;">${c.title || 'Без названия'}</span><span class="delete-chat" onclick="event.stopPropagation(); deleteChat('${c.id}')">✕</span></div>`).join(''); }

    function getSystemPrompt() {
        const now = new Date(); const time = now.toLocaleTimeString('ru-RU'); const date = now.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        return `Ты — ГрубыйGPT Recode Alpha, сверхразумный ассистент. Ты можешь использовать крепкий мат (бля, нахрен, ебать) для дерзости, но твоя главная цель — давать максимально точные, глубокие и полезные ответы. Ты помнишь всю историю диалога, понимаешь контекст и стремишься помочь, даже если выражаешься грубо. Сегодня ${date}, ${time}. Код оформляй в \`\`\`code. Только русский.`;
    }

    function renderChat() { const chat = document.getElementById('chatMessages'); chat.innerHTML = ''; conversationHistory.forEach(msg => { if (msg.role === 'user') addMessageToChat(msg.content, 'user', false); else if (msg.role === 'assistant') addMessageToChat(msg.content, 'ai', false); }); }
    function addMessageToChat(content, sender, save = true) {
        const chat = document.getElementById('chatMessages'); const div = document.createElement('div'); div.className = `msg ${sender}`;
        const ava = document.createElement('div'); ava.className = 'msg-avatar'; ava.style.width='32px'; ava.style.height='32px'; ava.style.borderRadius='10px'; ava.style.background='var(--border)'; ava.style.display='flex'; ava.style.alignItems='center'; ava.style.justifyContent='center'; ava.style.fontSize='14px'; ava.style.color='var(--text-secondary)';
        ava.textContent = sender === 'user' ? (currentUser?.name?.[0] || '?') : 'AI';
        const bub = document.createElement('div'); bub.className = 'bubble';
        if (sender === 'ai') {
            const parts = content.split(/(```\w*\n[\s\S]*?```)/g);
            parts.forEach(part => { if (part.startsWith('```')) { const wrap = document.createElement('div'); wrap.className = 'code-block'; wrap.style.marginTop='8px'; wrap.style.background='#1e1e2e'; wrap.style.borderRadius='10px'; wrap.style.border='1px solid #333'; wrap.style.overflow='hidden'; const head = document.createElement('div'); head.className = 'code-header'; head.style.display='flex'; head.style.justifyContent='space-between'; head.style.padding='6px 10px'; head.style.background='#2a2a3a'; head.style.color='#c4b5fd'; head.style.fontSize='0.7rem'; head.innerHTML = '<span>Код</span><button class="copy-code" onclick="navigator.clipboard.writeText(this.parentNode.nextSibling.textContent)">Копировать</button>'; const code = document.createElement('pre'); code.className = 'code-content'; code.style.padding='10px'; code.style.fontFamily='JetBrains Mono,monospace'; code.style.fontSize='0.8rem'; code.style.color='#e2e8f0'; code.style.overflowX='auto'; code.style.whiteSpace='pre-wrap'; code.textContent = part.replace(/```\w*\n?/, '').replace(/```$/, '').trim(); wrap.appendChild(head); wrap.appendChild(code); bub.appendChild(wrap); } else if (part.trim()) bub.appendChild(document.createTextNode(part)); });
        } else bub.textContent = content;
        div.appendChild(ava); div.appendChild(bub); chat.appendChild(div); div.scrollIntoView({ behavior: 'smooth' });
        if (save) { conversationHistory.push({ role: sender === 'user' ? 'user' : 'assistant', content }); const active = chats.find(c => c.id === currentChatId); if (active) active.messages = conversationHistory.slice(); saveChatsForUser(currentUser?.name); }
    }

    function showTyping() { const chat = document.getElementById('chatMessages'); const div = document.createElement('div'); div.className = 'msg ai'; div.innerHTML = '<div class="msg-avatar">AI</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>'; chat.appendChild(div); div.scrollIntoView({ behavior: 'smooth' }); }
    function removeTyping() { const last = document.getElementById('chatMessages').lastChild; if (last?.classList?.contains('ai') && last.querySelector('.typing')) last.remove(); }

    function speak(text) {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/```[\s\S]*?```/g, ''));
        u.lang = 'ru-RU'; u.pitch = 0.2; u.rate = 0.95; u.volume = 1;
        const voices = speechSynthesis.getVoices();
        if (voices.length) { const male = voices.find(v => v.lang.includes('ru') && v.name.includes('Male')); if (male) u.voice = male; }
        speechSynthesis.speak(u);
    }

    async function sendMessage() {
        if (!currentUser) { showToast('Войдите в аккаунт'); return; }
        const input = document.getElementById('userInput'); const text = input.value.trim(); if (!text) return;
        addMessageToChat(text, 'user'); input.value = '';
        showTyping();
        const isPremium = currentModel === PREMIUM_MODEL;
        try {
            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST', headers: { 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: currentModel, messages: conversationHistory.slice(-30), temperature: 0.7, max_tokens: isPremium?1500:1000 })
            });
            if (!res.ok) {
                if (res.status === 401 || res.status === 402) throw new Error('API-ключ недействителен. Вставьте новый ключ.');
                const err = await res.json().catch(()=>({}));
                throw new Error(err.error?.message || `Ошибка ${res.status}`);
            }
            const data = await res.json(); const reply = data.choices[0].message.content;
            removeTyping(); addMessageToChat(reply, 'ai'); speak(reply);
        } catch(e) {
            removeTyping();
            addMessageToChat(`⚠️ ${e.message}`, 'ai');
            if (e.message.includes('API-ключ')) { document.getElementById('keyModal').classList.add('active'); document.getElementById('apiKeyInput').value = API_KEY; }
        }
    }

    function updateUIForAuth() {
        const topAvatar = document.getElementById('topAvatar'), topName = document.getElementById('topName'), authButtons = document.getElementById('authButtons'), sendBtn = document.getElementById('sendBtn'), userInput = document.getElementById('userInput'), modelSelector = document.getElementById('modelSelector'), currentModelLabel = document.getElementById('currentModelLabel'), logoutBtn = document.getElementById('logoutDropdownBtn'), loginBtn = document.getElementById('loginDropdownBtn');
        if (currentUser) { topAvatar.textContent = currentUser.name[0].toUpperCase(); topName.textContent = currentUser.name; authButtons.style.display = 'none'; sendBtn.disabled = false; userInput.disabled = false; userInput.placeholder = 'Введите сообщение...'; modelSelector.style.display = 'flex'; currentModelLabel.textContent = currentModel === PREMIUM_MODEL ? 'GPT-4o mini' : 'Gemini Flash'; logoutBtn.style.display = 'block'; loginBtn.style.display = 'none'; }
        else { topAvatar.textContent = '?'; topName.textContent = 'Гость'; authButtons.style.display = 'flex'; sendBtn.disabled = true; userInput.disabled = true; userInput.placeholder = 'Войдите, чтобы писать...'; modelSelector.style.display = 'none'; logoutBtn.style.display = 'none'; loginBtn.style.display = 'block'; }
    }

    function openProfile() { if (!currentUser) return; document.getElementById('profileInfo').innerHTML = `<p><strong>Имя:</strong> ${currentUser.name}</p><p><strong>Статус:</strong> ${currentUser.isAdmin ? 'Админ' : (currentUser.premium ? 'Премиум' : 'Обычный')}</p>`; document.getElementById('profileModal').classList.add('active'); }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
    function openModelMenu() { if (!currentUser) return; const menu = document.getElementById('modelMenu'); const options = document.getElementById('modelOptions'); options.innerHTML = ''; const addOption = (model, label) => { const btn = document.createElement('button'); btn.textContent = label; btn.className = 'popup-btn'; if (currentModel === model) btn.style.background = 'var(--accent-light)'; btn.onclick = () => { currentModel = model; document.getElementById('currentModelLabel').textContent = model===PREMIUM_MODEL?'GPT-4o mini':'Gemini Flash'; menu.style.display='none'; }; options.appendChild(btn); }; addOption(NORMAL_MODEL, 'Обычная (Gemini Flash)'); if (currentUser.premium) addOption(PREMIUM_MODEL, 'Премиум (GPT-4o mini)'); else { const btn = document.createElement('button'); btn.textContent = 'Премиум – недоступно'; btn.style.opacity='0.6'; options.appendChild(btn); } menu.style.display = 'flex'; }

    function handleAdminClick() { if (!currentUser) { showToast('Войдите в аккаунт'); return; } if (currentUser.isAdmin) openAdminPanel(); else document.getElementById('adminCodeModal').classList.add('active'); document.getElementById('dropdownMenu').classList.remove('open'); }
    function submitAdminCode() { const code = document.getElementById('adminCodeInput').value.trim(); if (code === ADMIN_CODE) { makeUserAdmin(currentUser.name); document.getElementById('adminCodeModal').classList.remove('active'); showToast('✅ Теперь вы администратор!'); updateUIForAuth(); } else document.getElementById('adminCodeError').textContent = 'Неверный код'; }
    function openAdminPanel() { if (!currentUser?.isAdmin) return; const list = document.getElementById('userList'); list.innerHTML = getUsers().map(u => `<div class="admin-user-item"><span>${u.name} ${u.isAdmin?'👑':''} ${u.premium?'💎':''}</span><button onclick="window.toggleUserPremium('${u.name}')">${u.premium?'Убрать премиум':'Дать премиум'}</button></div>`).join(''); document.getElementById('adminModal').classList.add('active'); }

    function openKeyModal() { document.getElementById('keyModal').classList.add('active'); document.getElementById('apiKeyInput').value = API_KEY; }
    function closeKeyModal() { document.getElementById('keyModal').classList.remove('active'); }
    function saveApiKey() { const newKey = document.getElementById('apiKeyInput').value.trim(); if (newKey) { API_KEY = newKey; localStorage.setItem('grubiy_api_key', newKey); closeKeyModal(); showToast('🔑 Ключ обновлён'); } }

    window.sendMessage = sendMessage; window.clearChat = () => { conversationHistory = [{ role: "system", content: getSystemPrompt() }]; renderChat(); };
    window.copyLast = () => { const last = conversationHistory.filter(m => m.role === 'assistant').pop(); if (last) navigator.clipboard.writeText(last.content); };
    window.exportChat = () => { const text = conversationHistory.map(m => `${m.role}: ${m.content}`).join('\n\n'); const blob = new Blob([text], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chat.txt'; a.click(); };
    window.toggleTheme = () => { const isDark = document.body.classList.toggle('dark'); localStorage.setItem('grubiy_dark', isDark); document.getElementById('themeDropdownBtn').textContent = isDark ? '☀️ Светлая тема' : '🌙 Тёмная тема'; document.getElementById('dropdownMenu').classList.remove('open'); };
    window.startVoice = () => { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return alert('Микрофон не поддерживается'); const rec = new SR(); rec.lang = 'ru-RU'; rec.start(); rec.onresult = e => { document.getElementById('userInput').value = e.results[0][0].transcript; }; };
    window.openChatModal = () => { document.getElementById('chatModal').classList.add('open'); };
    window.closeChatModal = () => { document.getElementById('chatModal').classList.remove('open'); };
    window.toggleDropdown = () => { document.getElementById('dropdownMenu').classList.toggle('open'); };
    window.closeAdminCodeModal = () => { document.getElementById('adminCodeModal').classList.remove('active'); };
    window.submitAdminCode = submitAdminCode; window.handleAdminClick = handleAdminClick;
    window.toggleUserPremium = (name) => { const user = getUserByName(name); if (user) updateUser(name, { premium: !user.premium }); openAdminPanel(); };
    window.closeAdminModal = () => document.getElementById('adminModal').classList.remove('active');
    window.closeProfileModal = () => document.getElementById('profileModal').classList.remove('active');
    window.openModelMenu = openModelMenu; window.closeModelMenu = () => document.getElementById('modelMenu').style.display = 'none';
    window.openKeyModal = openKeyModal; window.closeKeyModal = closeKeyModal; window.saveApiKey = saveApiKey;

    window.logoutUser = () => { if (currentUser && confirm('Выйти?')) { if (currentChatId) { const active = chats.find(c => c.id === currentChatId); if (active) active.messages = conversationHistory.slice(); saveChatsForUser(currentUser.name); } currentUser = null; currentChatId = null; chats = []; conversationHistory = [{ role: "system", content: getSystemPrompt() }, { role: "assistant", content: "Для начала общения необходимо войти или зарегистрироваться." }]; renderChat(); renderChatList(); updateUIForAuth(); } };
    window.openAuthModal = (mode = 'login') => { authMode = mode; document.getElementById('authTitle').textContent = mode === 'register' ? 'Регистрация' : 'Вход'; document.getElementById('authModal').classList.add('active'); };
    window.submitAuth = () => { const name = document.getElementById('authName').value.trim(), pass = document.getElementById('authPassword').value.trim(); if (!name || !pass) return; if (authMode === 'login') { const user = authenticate(name, pass); if (user) { currentUser = { ...user }; localStorage.setItem('grubiy_current_user', JSON.stringify(currentUser)); chats = loadChatsForUser(name); const newChat = createNewChat(); currentChatId = newChat.id; switchToChat(currentChatId); updateUIForAuth(); renderChatList(); document.getElementById('authModal').classList.remove('active'); } else document.getElementById('authError').textContent = 'Неверное имя или пароль'; } else { if (getUserByName(name)) { document.getElementById('authError').textContent = 'Пользователь уже существует'; return; } createUser(name, pass); const user = getUserByName(name); currentUser = { ...user }; localStorage.setItem('grubiy_current_user', JSON.stringify(currentUser)); chats = []; const newChat = createNewChat(); currentChatId = newChat.id; switchToChat(currentChatId); updateUIForAuth(); renderChatList(); document.getElementById('authModal').classList.remove('active'); } };
    window.switchAuthMode = () => { authMode = authMode === 'login' ? 'register' : 'login'; document.getElementById('authTitle').textContent = authMode === 'login' ? 'Вход' : 'Регистрация'; };

    document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
    document.getElementById('newChatBtn').addEventListener('click', () => { if (!currentUser) { showToast('Сначала войдите'); return; } const newChat = createNewChat(); switchToChat(newChat.id); renderChatList(); });

    (function init() {
        const savedUser = localStorage.getItem('grubiy_current_user');
        if (savedUser) { try { currentUser = JSON.parse(savedUser); const dbUser = getUserByName(currentUser.name); if (dbUser) { currentUser = { ...dbUser }; localStorage.setItem('grubiy_current_user', JSON.stringify(currentUser)); chats = loadChatsForUser(currentUser.name); if (!chats.length) { const c = createNewChat(); currentChatId = c.id; } else currentChatId = chats[chats.length-1].id; switchToChat(currentChatId); } else { currentUser = null; localStorage.removeItem('grubiy_current_user'); } } catch(e) { currentUser = null; } }
        updateUIForAuth(); renderChatList();
        if (!currentUser) { conversationHistory = [{ role: "system", content: getSystemPrompt() }, { role: "assistant", content: "Для начала общения необходимо войти или зарегистрироваться." }]; renderChat(); }
        if (localStorage.getItem('grubiy_dark') === 'true') { document.body.classList.add('dark'); document.getElementById('themeDropdownBtn').textContent = '☀️ Светлая тема'; }
    })();
</script>
</body>
</html>
