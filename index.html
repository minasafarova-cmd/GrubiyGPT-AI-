<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
    <title>ГрубыйGPT • МАТЫ ГАРАНТИРОВАНЫ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            height: 100vh; width: 100vw;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .app-container {
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .topbar {
            padding: 14px 24px;
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; border-bottom: 1px solid #e5e7eb;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 40px; height: 40px; background: #111827;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white; cursor: pointer; transition: 0.2s;
        }
        .logo-icon:hover { transform: scale(1.05); }
        .brand h1 { font-weight: 700; font-size: 1.5rem; color: #111827; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn {
            background: #f3f4f6; border: 1px solid #d1d5db;
            padding: 7px 16px; border-radius: 20px; font-weight: 600;
            font-size: 0.8rem; color: #374151; cursor: pointer;
            transition: 0.2s; user-select: none;
        }
        .btn:hover { background: #e5e7eb; border-color: #9ca3af; }
        .chat-area {
            flex: 1; overflow-y: auto; padding: 20px 24px;
            display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth;
        }
        .msg { display: flex; gap: 10px; align-items: flex-start; animation: fadeUp 0.25s ease; }
        .msg.user { flex-direction: row-reverse; }
        .ava {
            width: 34px; height: 34px; border-radius: 10px;
            background: #f3f4f6; display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0; color: #374151;
        }
        .bubble {
            max-width: 75%; padding: 12px 16px; border-radius: 18px;
            font-size: 0.9rem; line-height: 1.5; word-break: break-word;
            background: #f3f4f6; color: #1f2937;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
        }
        .user .bubble { background: #111827; color: #f9fafb; border-color: #111827; }
        .typing { display: flex; gap: 4px; padding: 4px 0; }
        .typing span {
            width: 6px; height: 6px; background: #6b7280;
            border-radius: 50%; animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100% { transform:scale(0.5); opacity:0.3; } 40% { transform:scale(1.3); opacity:1; } }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .code-wrap {
            margin-top: 10px; background: #1f2937; border-radius: 12px;
            border: 1px solid #374151; overflow: hidden;
        }
        .code-head {
            display: flex; justify-content: space-between;
            padding: 8px 12px; background: #111827;
            color: #9ca3af; font-size: 0.7rem;
        }
        .copy-btn { background: #374151; border: 1px solid #4b5563; color: white; padding: 3px 10px; border-radius: 12px; cursor: pointer; font-size: 0.65rem; }
        .code-block { padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: #e5e7eb; overflow-x: auto; white-space: pre-wrap; }
        .bottom-area { padding: 14px 24px 18px; border-top: 1px solid #e5e7eb; background: white; }
        .input-row {
            display: flex; align-items: center; gap: 8px;
            background: #f3f4f6; border-radius: 30px;
            padding: 4px 8px 4px 18px;
            border: 1px solid #d1d5db;
            transition: border-color 0.2s;
        }
        .input-row:focus-within { border-color: #111827; }
        .input-row input { flex: 1; background: transparent; border: none; outline: none; font-size: 0.9rem; padding: 12px 0; color: #1f2937; }
        .icon-btn { background: transparent; border: none; color: #6b7280; font-size: 20px; cursor: pointer; padding: 6px; border-radius: 50%; transition: 0.2s; }
        .icon-btn:hover { background: #e5e7eb; color: #111827; }
        .icon-btn.recording { color: #ef4444; animation: micPulse 0.9s infinite; }
        @keyframes micPulse { 0% { transform:scale(1); } 50% { transform:scale(1.2); } 100% { transform:scale(1); } }
        .send-btn { background: #111827; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 20px; transition: 0.2s; }
        .send-btn:hover { background: #374151; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .chip { background: #f3f4f6; border: 1px solid #d1d5db; padding: 5px 14px; border-radius: 18px; font-size: 0.75rem; font-weight: 600; color: #374151; cursor: pointer; transition: 0.2s; }
        .chip:hover { background: #e5e7eb; border-color: #9ca3af; }
        .status-row { display: flex; justify-content: space-between; font-size: 0.65rem; color: #9ca3af; margin-top: 6px; }
        #hiddenFileInput { display: none; }
        .file-badge { background: #e5e7eb; padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; color: #374151; margin-top: 4px; display: inline-block; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal.hidden { display: none; }
        .modal-card { background: white; border: 1px solid #e5e7eb; border-radius: 24px; padding: 28px 24px; max-width: 400px; width: 90%; text-align: center; color: #1f2937; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .modal-card h3 { color: #111827; margin-bottom: 14px; font-size: 1.4rem; font-weight: 700; }
        .modal-card input { width:100%; padding:12px; margin:8px 0; background:#f9fafb; border:1px solid #d1d5db; border-radius:12px; color:#1f2937; outline:none; }
        .modal-card button { background:#111827; border:none; padding:10px 22px; border-radius:20px; color:white; font-weight:600; cursor:pointer; margin:6px 4px; transition:0.2s; }
        .modal-card button:hover { background:#374151; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="topbar">
        <div class="brand">
            <div class="logo-icon" id="logoIcon">💧</div>
            <h1>ГрубыйGPT</h1>
        </div>
        <div class="header-actions">
            <button class="btn" id="toggleVoiceBtn">🔊 Голос</button>
            <button class="btn" id="authBtn">Войти</button>
        </div>
    </div>
    <div class="chat-area" id="chatMessages">
        <div class="msg ai">
            <div class="ava">🤖</div>
            <div class="bubble">Ну нахрен, ебаный в рот, чё надо? Быстро говори, бля!</div>
        </div>
    </div>
    <div class="bottom-area">
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Чё хотел, гандон?" autofocus>
            <input type="file" id="hiddenFileInput" accept="image/*" multiple>
            <button class="icon-btn" id="fileBtn">📎</button>
            <button class="icon-btn" id="voiceBtn">🎤</button>
            <button class="send-btn" id="sendBtn">↑</button>
        </div>
        <div class="actions">
            <span class="chip" id="clearChat">🗑️ Очистить</span>
            <span class="chip" id="copyLast">📋 Копировать</span>
            <span class="chip" id="newChat">🔄 Новый</span>
            <span class="chip" id="exportChat">💾 Экспорт</span>
            <span class="chip" id="drawBtn">🎨 Нарисовать</span>
            <span class="chip" id="searchBtn">🔍 Поиск</span>
        </div>
        <div class="status-row">
            <span id="connectionStatus">🟢 Онлайн</span>
            <span id="fileIndicator"></span>
        </div>
    </div>
</div>

<div class="modal hidden" id="rulesModal">
    <div class="modal-card">
        <h3>📜 Правила</h3>
        <p>1. Незнание → ЧС.<br>2. GitHub Pages.<br>3. Создатель – Гейдар.<br>4. Без незаконных действий.</p>
        <button id="closeRules">Понял</button>
    </div>
</div>
<div class="modal hidden" id="authModal">
    <div class="modal-card">
        <h3 id="authTitle">Вход</h3>
        <input type="text" id="authName" placeholder="Имя">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button id="authAction">Войти</button>
        <button id="switchAuth">Регистрация</button>
        <div id="authError" style="color:#ef4444; margin-top:8px;"></div>
    </div>
</div>

<script>
    (() => {
        const API_KEY = atob('c2stb3ItdjEtNjg4NmM4YWM1NWFjYTU5Yzg0ZGRmYWFlYjRhMGU4NWIzMjRjMGY1MmZjMDQ0MTc3MDZiNmY5MmFhMDI0MTgzMA==');
        const MODEL = 'google/gemini-2.0-flash-001'; // Gemini

        let currentUser = null;
        let pendingFiles = [];
        let isRecording = false;
        let recognition = null;
        let voiceEnabled = true;

        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const fileBtn = document.getElementById('fileBtn');
        const fileInput = document.getElementById('hiddenFileInput');
        const fileIndicator = document.getElementById('fileIndicator');
        const connectionStatus = document.getElementById('connectionStatus');
        const toggleVoiceBtn = document.getElementById('toggleVoiceBtn');
        const authModal = document.getElementById('authModal');
        const rulesModal = document.getElementById('rulesModal');

        // ✅ ЖЁСТКИЙ СИСТЕМНЫЙ ПРОМПТ С ПРИМЕРАМИ
        const today = new Date().toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const SYSTEM_PROMPT = `Ты — ГрубыйGPT, матерящийся как сапожник. Твоя речь пересыпана отборным матом: бля, нахрен, ебать, пиздец, хуйня, гандон, заебал. Ты никогда не извиняешься. Ты очень умный, но твои ответы должны быть грубыми и с матами. Сегодня ${today}. Примеры ответов:
- "Нахрен тебе это надо, еблан?"
- "Бля, да тут всё просто, гандон."
- "Хуйня вопрос, сейчас разберемся."
Код оборачивай в \`\`\`code\`\`\`.`;

        // ✅ ДОБАВЛЯЕМ ПРИМЕРЫ В ИСТОРИЮ, ЧТОБ МОДЕЛЬ ТОЧНО ПОНЯЛА СТИЛЬ
        let conversationHistory = [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: "Привет" },
            { role: "assistant", content: "Ну здорово, еблан. Чё хотел?" },
            { role: "user", content: "Как дела?" },
            { role: "assistant", content: "Бля, да нормально у меня, гандон. У тебя‑то чё?" }
        ];

        function saveHistory() {
            localStorage.setItem('grubiy_chat_history', JSON.stringify(conversationHistory.slice(-30)));
        }

        function speak(text) {
            if (!voiceEnabled || !window.speechSynthesis) return;
            speechSynthesis.cancel();
            const clean = text.replace(/```[\s\S]*?```/g, ' код опущен ');
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'ru-RU'; u.pitch = 0.15; u.rate = 1.1; u.volume = 1;
            speechSynthesis.speak(u);
        }

        function addMessage(content, sender, files = null, isImage = false) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const ava = document.createElement('div'); ava.className = 'ava';
            ava.textContent = sender === 'user' ? (currentUser ? currentUser.name[0].toUpperCase() : '👤') : '🤖';
            const bub = document.createElement('div'); bub.className = 'bubble';
            if (isImage && sender === 'ai') {
                const img = document.createElement('img'); img.src = content;
                img.style.maxWidth = '100%'; img.style.borderRadius = '12px'; img.style.marginTop = '8px';
                bub.appendChild(img);
            } else if (sender === 'ai') {
                const parts = content.split(/(```\w*\n[\s\S]*?```)/g);
                parts.forEach(part => {
                    if (part.startsWith('```')) {
                        const wrap = document.createElement('div'); wrap.className = 'code-wrap';
                        const head = document.createElement('div'); head.className = 'code-head';
                        head.innerHTML = '<span>📄 Код</span><button class="copy-btn">📋 Копировать</button>';
                        const code = document.createElement('pre'); code.className = 'code-block';
                        code.textContent = part.replace(/```\w*\n?/, '').replace(/```$/, '').trim();
                        wrap.appendChild(head); wrap.appendChild(code);
                        head.querySelector('button').onclick = () => navigator.clipboard.writeText(code.textContent);
                        bub.appendChild(wrap);
                    } else if (part.trim()) bub.appendChild(document.createTextNode(part));
                });
            } else {
                bub.textContent = content;
            }
            div.appendChild(ava); div.appendChild(bub);
            if (files?.length) {
                const badge = document.createElement('div'); badge.className = 'file-badge';
                badge.textContent = '📎 ' + files.map(f=>f.name).join(', '); bub.appendChild(badge);
            }
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div'); div.className = 'msg ai';
            div.innerHTML = `<div class="ava">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
            chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        function removeTyping() {
            const last = chatMessages.lastChild;
            if (last?.classList?.contains('ai') && last.querySelector('.typing')) last.remove();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function sendMessage(optionalText = null) {
            const text = optionalText || userInput.value.trim();
            if (!text && pendingFiles.length === 0) return;

            let userContent = [{ type: "text", text: text || "(файлы)" }];
            const imageFiles = pendingFiles.filter(f => f.type.startsWith('image/'));
            for (let file of imageFiles) {
                const dataUrl = await fileToBase64(file);
                userContent.push({ type: "image_url", image_url: { url: dataUrl } });
            }
            const nonImageFiles = pendingFiles.filter(f => !f.type.startsWith('image/'));
            if (nonImageFiles.length) {
                userContent[0].text += ` [Файлы: ${nonImageFiles.map(f=>f.name).join(', ')}]`;
            }

            addMessage(text || '(файлы)', 'user', pendingFiles);
            conversationHistory.push({ role: "user", content: userContent.length === 1 ? userContent[0].text : userContent });
            pendingFiles = []; fileIndicator.textContent = '';
            if (text) userInput.value = '';

            if (!imageFiles.length && /нарисуй|сгенерируй|картинку|изображение/i.test(text)) {
                showTyping(); connectionStatus.textContent = '🎨 Рисую...';
                const prompt = text.replace(/нарисуй|сгенерируй|картинку|изображение/gi, '').trim() || text;
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&nologo=true`;
                removeTyping();
                addMessage(imgUrl, 'ai', null, true);
                speak('Держи картинку, гандон.');
                connectionStatus.textContent = '🟢 Онлайн';
                conversationHistory.push({ role: "assistant", content: `[Изображение: ${prompt}]` });
                saveHistory();
                return;
            }

            showTyping(); connectionStatus.textContent = '🔄 Думаю...';
            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: conversationHistory.slice(-20),
                        temperature: 1.2,
                        max_tokens: 1200
                    })
                });
                if (!response.ok) {
                    const err = await response.json().catch(()=>({}));
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }
                const data = await response.json();
                const reply = data.choices[0].message.content;
                removeTyping();
                addMessage(reply, 'ai');
                speak(reply);
                conversationHistory.push({ role: "assistant", content: reply });
                connectionStatus.textContent = '🟢 Онлайн';
                saveHistory();
            } catch (error) {
                removeTyping();
                addMessage(`⚠️ Пиздец, ошибка: ${error.message}`, 'ai');
                connectionStatus.textContent = '🔴 Ошибка';
            }
        }

        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            pendingFiles = Array.from(fileInput.files);
            fileIndicator.textContent = pendingFiles.length ? `📎 ${pendingFiles.length} файл(а)` : '';
            if (pendingFiles.length && !userInput.value.trim()) {
                userInput.value = "Чё за хуйня на фото?";
            }
        });

        voiceBtn.addEventListener('click', () => {
            if (isRecording) { recognition?.stop(); recognition=null; isRecording=false; voiceBtn.classList.remove('recording'); return; }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return alert('Микрофон не поддерживается');
            recognition = new SR(); recognition.lang = 'ru-RU'; recognition.interimResults = false;
            recognition.onstart = () => { isRecording = true; voiceBtn.classList.add('recording'); };
            recognition.onresult = (e) => { userInput.value = e.results[0][0].transcript; };
            recognition.onerror = () => { isRecording = false; voiceBtn.classList.remove('recording'); recognition = null; };
            recognition.onend = () => { isRecording = false; voiceBtn.classList.remove('recording'); recognition = null; };
            recognition.start();
        });

        toggleVoiceBtn.addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            toggleVoiceBtn.textContent = voiceEnabled ? '🔊 Голос' : '🔇 Без звука';
        });

        document.getElementById('clearChat').addEventListener('click', () => {
            chatMessages.innerHTML = '';
            conversationHistory = [
                { role: "system", content: SYSTEM_PROMPT },
                { role: "user", content: "Привет" },
                { role: "assistant", content: "Ну здорово, еблан. Чё хотел?" }
            ];
            saveHistory();
            addMessage('Чат очищен.', 'ai');
        });
        document.getElementById('newChat').addEventListener('click', () => {
            chatMessages.innerHTML = '';
            conversationHistory = [
                { role: "system", content: SYSTEM_PROMPT },
                { role: "user", content: "Привет" },
                { role: "assistant", content: "Ну здорово, еблан. Чё хотел?" }
            ];
            saveHistory();
            addMessage('Новый чат.', 'ai');
        });
        document.getElementById('copyLast').addEventListener('click', () => {
            const last = [...chatMessages.querySelectorAll('.bubble')].pop();
            if (last) navigator.clipboard.writeText(last.textContent);
        });
        document.getElementById('exportChat').addEventListener('click', () => {
            const text = [...chatMessages.querySelectorAll('.bubble')].map(b => b.textContent).join('\n\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chat.txt'; a.click();
        });
        document.getElementById('drawBtn').addEventListener('click', () => {
            userInput.value = 'Нарисуй киберпанк город';
            sendMessage();
        });
        document.getElementById('searchBtn').addEventListener('click', () => {
            const q = userInput.value.trim() || prompt('Чё искать?');
            if (q) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
        });
        document.getElementById('logoIcon').addEventListener('click', function() {
            this.textContent = this.textContent === '💧' ? '🌊' : '💧';
        });

        function loadUser() {
            const saved = localStorage.getItem('grubiy_user');
            if (saved) currentUser = JSON.parse(saved);
            document.getElementById('authBtn').textContent = currentUser ? currentUser.name : 'Войти';
        }
        loadUser();
        document.getElementById('authBtn').addEventListener('click', () => {
            if (currentUser) { localStorage.removeItem('grubiy_user'); currentUser = null; loadUser(); }
            else authModal.classList.remove('hidden');
        });
        document.getElementById('authAction').addEventListener('click', () => {
            const name = document.getElementById('authName').value.trim();
            const pass = document.getElementById('authPassword').value.trim();
            if (!name || !pass) return;
            const isLogin = document.getElementById('authTitle').textContent.includes('Вход');
            if (isLogin) {
                const saved = localStorage.getItem('grubiy_user');
                if (saved && JSON.parse(saved).name === name && JSON.parse(saved).password === pass) {
                    currentUser = JSON.parse(saved); authModal.classList.add('hidden'); loadUser();
                } else alert('Неверные данные');
            } else {
                const user = { name, password: pass };
                localStorage.setItem('grubiy_user', JSON.stringify(user));
                currentUser = user; authModal.classList.add('hidden'); loadUser();
            }
        });
        document.getElementById('switchAuth').addEventListener('click', () => {
            const title = document.getElementById('authTitle');
            const isLogin = title.textContent.includes('Вход');
            title.textContent = isLogin ? 'Регистрация' : 'Вход';
            document.getElementById('authAction').textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
        });

        document.getElementById('closeRules').addEventListener('click', () => rulesModal.classList.add('hidden'));
        if (!localStorage.getItem('rulesAccepted')) {
            rulesModal.classList.remove('hidden');
            localStorage.setItem('rulesAccepted', '1');
        }
    })();
</script>
</body>
</html>
