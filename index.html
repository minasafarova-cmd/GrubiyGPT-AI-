<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>ГрубыйGPT • Финальный</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #ffffff;
      --surface: #f9fafb;
      --text: #111827;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
    }
    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent: #a78bfa;
      --accent-light: #312e81;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    .app {
      width: 100%; height: 100%;
      max-width: 900px;
      background: var(--surface);
      display: flex; flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      body { padding: 16px; }
      .app { border-radius: 24px; height: calc(100vh - 32px); }
    }
    .header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white;
      cursor: pointer;
    }
    .brand h1 { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .icon-btn:hover { background: var(--accent-light); color: var(--accent); }
    .icon-btn.active { background: var(--accent); color: white; }
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; animation: msgPop 0.3s ease; }
    .msg.user { flex-direction: row-reverse; }
    @keyframes msgPop {
      from { opacity:0; transform: translateY(8px) scale(0.98); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; color: var(--text-secondary);
    }
    .user .avatar { background: var(--accent); color: white; }
    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      font-size: 0.9rem; line-height: 1.4; word-break: break-word;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border);
    }
    .user .bubble { background: var(--accent); color: white; border-color: transparent; }
    .typing { display: flex; gap: 4px; padding: 4px 0; }
    .typing span {
      width: 5px; height: 5px; background: var(--accent);
      border-radius: 50%; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,80%,100% { transform:scale(0.5); opacity:0.3; }
      40% { transform:scale(1.3); opacity:1; }
    }
    .input-container {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .input-row {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg); border-radius: 24px;
      padding: 4px 4px 4px 16px;
      border: 1px solid var(--border);
    }
    .input-row input {
      flex: 1; background: transparent; border: none;
      outline: none; font-size: 0.9rem; padding: 10px 0;
      color: var(--text);
    }
    .input-row input::placeholder { color: var(--text-secondary); }
    .action-btns { display: flex; gap: 4px; }
    .send-btn {
      background: var(--accent); border: none;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: white; font-size: 18px;
    }
    .quick-actions {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .chip {
      background: var(--bg); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 14px;
      font-size: 0.72rem; font-weight: 500;
      color: var(--text-secondary); cursor: pointer;
    }
    .chip:hover { background: var(--accent-light); color: var(--accent); }
    .status-row {
      display: flex; justify-content: space-between;
      font-size: 0.65rem; color: var(--text-secondary); margin-top: 6px;
    }
  </style>
</head>
<body class="light">
<div class="app">
  <div class="header">
    <div class="brand">
      <div class="logo" id="logoIcon">💜</div>
      <h1>ГрубыйGPT • Финальный</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" id="voiceToggle" onclick="toggleVoice()">🔊</button>
      <button class="icon-btn" id="authBtn" onclick="handleAuthClick()">👤</button>
    </div>
  </div>
  <div class="chat-area" id="chatMessages">
    <div class="msg ai">
      <div class="avatar">🤖</div>
      <div class="bubble">Привет! Если ты видишь это с файла, я в офлайне. Залей на GitHub Pages – и я стану реальным ИИ.</div>
    </div>
  </div>
  <div class="input-container">
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Пиши сюда..." autofocus onkeydown="if(event.key==='Enter') sendMessage()">
      <div class="action-btns">
        <button class="icon-btn" id="voiceBtn" onclick="startVoice()">🎤</button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
    <div class="quick-actions">
      <span class="chip" onclick="clearChat()">🗑️ Очистить</span>
      <span class="chip" onclick="copyLast()">📋 Копировать</span>
      <span class="chip" onclick="newChat()">🔄 Новый</span>
      <span class="chip" onclick="exportChat()">💾 Экспорт</span>
    </div>
    <div class="status-row">
      <span id="connectionStatus">🔌 Проверка связи…</span>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://text.pollinations.ai/';
  const MODEL = 'gpt-4o-mini';
  let isOnlineMode = false;

  let currentUser = JSON.parse(localStorage.getItem('grubiy_current_user') || 'null');
  let currentChatId = currentUser ? `user_${currentUser.name}` : 'default';
  const SYSTEM_PROMPT = `Ты — ГрубыйGPT, матерящийся ИИ. Маты: бля, нахрен, ебать. Сегодня ${new Date().toLocaleDateString('ru-RU')}. Отвечай точно и с матами. Код в \`\`\`code. Только русский.`;
  let conversationHistory = JSON.parse(localStorage.getItem(`chat_${currentChatId}`) || 'null') || [
    { role: "system", content: SYSTEM_PROMPT },
    { role: "assistant", content: "Привет! Я готов к работе." }
  ];
  let voiceEnabled = true;
  let darkMode = localStorage.getItem('grubiy_dark') === 'true';
  let recognition = null;
  let isRecording = false;

  function applyTheme() {
    document.body.classList.toggle('dark', darkMode);
    document.getElementById('themeToggle').textContent = darkMode ? '☀️' : '🌙';
  }
  applyTheme();

  function saveHistory() {
    localStorage.setItem(`chat_${currentChatId}`, JSON.stringify(conversationHistory));
  }

  function addMessage(content, sender) {
    const chat = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    const ava = document.createElement('div'); ava.className = 'avatar';
    ava.textContent = sender === 'user' ? (currentUser ? currentUser.name[0] : '👤') : '🤖';
    const bub = document.createElement('div'); bub.className = 'bubble';
    bub.innerHTML = content;
    div.appendChild(ava); div.appendChild(bub);
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
  }

  function showTyping() {
    const chat = document.getElementById('chatMessages');
    const div = document.createElement('div'); div.className = 'msg ai';
    div.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth' });
  }
  function removeTyping() {
    const last = document.getElementById('chatMessages').lastChild;
    if (last?.classList?.contains('ai') && last.querySelector('.typing')) last.remove();
  }

  function speak(text) {
    if (!voiceEnabled || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/<[^>]*>/g, ''));
    u.lang = 'ru-RU'; u.pitch = 0.15; u.rate = 1.1;
    speechSynthesis.speak(u);
  }

  // Проверка соединения с Pollinations при загрузке
  async function checkConnection() {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: "user", content: "test" }], model: MODEL, max_tokens: 5 }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      if (resp.ok) {
        isOnlineMode = true;
        document.getElementById('connectionStatus').textContent = '🟢 Pollinations AI (онлайн)';
      } else {
        throw new Error('no');
      }
    } catch (e) {
      isOnlineMode = false;
      document.getElementById('connectionStatus').textContent = '🔴 Офлайн (залей на GitHub Pages)';
    }
  }
  checkConnection();

  // Офлайн-заглушка
  function offlineReply(text) {
    const insults = ['еблан', 'гандон', 'хрен', 'заебал'];
    const r = insults[Math.floor(Math.random() * insults.length)];
    return `Без интернета я только матерюсь, ${r}. Ты спросил «${text}» – иди нахрен. Залей страницу на GitHub Pages, чтобы я стал умным.`;
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    conversationHistory.push({ role: "user", content: text });
    input.value = '';

    if (isOnlineMode) {
      showTyping(); document.getElementById('connectionStatus').textContent = '🔄 Думаю…';
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: conversationHistory.slice(-20),
            model: MODEL,
            temperature: 1.2,
            max_tokens: 1200
          })
        });
        if (!response.ok) throw new Error('Pollinations error');
        const data = await response.json();
        const reply = data.text || data.choices?.[0]?.message?.content || 'Бля, ответ не распознал.';
        removeTyping();
        addMessage(reply, 'ai');
        speak(reply);
        conversationHistory.push({ role: "assistant", content: reply });
        saveHistory();
        document.getElementById('connectionStatus').textContent = '🟢 Pollinations AI';
      } catch (e) {
        removeTyping();
        const fallback = offlineReply(text);
        addMessage(fallback, 'ai');
        speak(fallback);
        conversationHistory.push({ role: "assistant", content: fallback });
        saveHistory();
        document.getElementById('connectionStatus').textContent = '🔴 Ошибка';
      }
    } else {
      // Офлайн-режим
      const reply = offlineReply(text);
      addMessage(reply, 'ai');
      speak(reply);
      conversationHistory.push({ role: "assistant", content: reply });
      saveHistory();
    }
  }

  window.sendMessage = sendMessage;

  window.clearChat = function() {
    conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
    document.getElementById('chatMessages').innerHTML = '';
    saveHistory();
  };
  window.copyLast = function() {
    const last = conversationHistory.filter(m => m.role === 'assistant').pop();
    if (last) navigator.clipboard.writeText(last.content);
  };
  window.newChat = function() {
    conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
    saveHistory();
    document.getElementById('chatMessages').innerHTML = '';
  };
  window.exportChat = function() {
    const text = conversationHistory.map(m => `${m.role}: ${m.content}`).join('\n\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chat.txt'; a.click();
  };
  window.toggleTheme = function() {
    darkMode = !darkMode;
    localStorage.setItem('grubiy_dark', darkMode);
    applyTheme();
  };
  window.toggleVoice = function() {
    voiceEnabled = !voiceEnabled;
    document.getElementById('voiceToggle').textContent = voiceEnabled ? '🔊' : '🔇';
  };
  window.startVoice = function() {
    if (isRecording) { recognition?.stop(); isRecording=false; document.getElementById('voiceBtn').classList.remove('active'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return alert('Микрофон не поддерживается');
    recognition = new SR(); recognition.lang = 'ru-RU';
    recognition.onstart = () => { isRecording=true; document.getElementById('voiceBtn').classList.add('active'); };
    recognition.onresult = e => { document.getElementById('userInput').value = e.results[0][0].transcript; };
    recognition.onerror = () => { isRecording=false; document.getElementById('voiceBtn').classList.remove('active'); };
    recognition.onend = () => { isRecording=false; document.getElementById('voiceBtn').classList.remove('active'); };
    recognition.start();
  };
  window.handleAuthClick = function() {
    if (currentUser) {
      if (confirm('Выйти?')) {
        localStorage.removeItem('grubiy_current_user');
        currentUser = null; currentChatId = 'default';
        document.getElementById('authBtn').textContent = '👤';
        conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
        document.getElementById('chatMessages').innerHTML = ''; saveHistory();
      }
    } else {
      const name = prompt('Введи имя') || 'Гость';
      currentUser = { name };
      localStorage.setItem('grubiy_current_user', JSON.stringify(currentUser));
      currentChatId = `user_${name}`;
      document.getElementById('authBtn').textContent = name[0].toUpperCase();
      conversationHistory = [{ role: "system", content: SYSTEM_PROMPT }];
      document.getElementById('chatMessages').innerHTML = ''; saveHistory();
    }
  };

  document.getElementById('authBtn').textContent = currentUser ? currentUser.name[0].toUpperCase() : '👤';
</script>
</body>
</html>
